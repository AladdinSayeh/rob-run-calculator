services:
  - type: web
    name: rob-run-api
    runtime: node
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://aladdinsayeh.github.io
      - key: MONGODB_URI
        sync: false
